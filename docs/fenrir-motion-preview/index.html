<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フェンリル・重心モーション候補</title><style>
*{box-sizing:border-box}body{margin:0;background:#ece9df;color:#27352f;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px;margin:4px 0 8px}p{line-height:1.65;margin:5px 0}header small{color:#6d6656;letter-spacing:.1em}.grid{display:grid;grid-template-columns:minmax(0,650px) minmax(0,390px);gap:24px;margin-top:22px}section{min-width:0}h2{font-size:16px;margin:0 0 10px}.stage{background:radial-gradient(ellipse at 50% 80%,#d1d7c4,#e2e3d9 65%);border-radius:18px;position:relative;overflow:hidden;border:1px solid #c4c9ba}.large{aspect-ratio:1.05}.large canvas{width:100%;height:100%;display:block}.floor{position:absolute;left:10%;right:10%;bottom:4%;height:1px;background:#87968155}canvas{position:relative}.smallstage{width:100%;aspect-ratio:720/400}.smallstage canvas{width:100%;height:100%;display:block}.label{position:absolute;left:14px;top:12px;font-size:12px;color:#4c5b50}.original{width:150px;height:140px;object-fit:contain;display:block;margin:14px auto;background:#e2e3d9;border-radius:8px}button{font:inherit;padding:9px 15px;border:1px solid #9ca99e;background:#f8f6ef;border-radius:8px;cursor:pointer}button.active{background:#284e43;color:white}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}input{flex:1;min-width:130px;accent-color:#315d4b}.note{font-size:13px;color:#606b60;margin:14px 0}.phase{font-size:13px;min-width:85px}aside{border-top:1px solid #c5cabd;padding-top:14px;margin-top:16px}a{color:#315d4b}@media(max-width:750px){main{padding:16px}.grid{grid-template-columns:1fr}.smallstage{max-width:390px}h1{font-size:22px}}
</style><main><header><small>MOTION STUDY · 01</small><h1>フェンリル：重心と踏ん張り</h1><p>肩を前へ沈める → 前脚で受ける → 体を戻す。元の絵を使った6秒の候補です。</p></header><div class="grid"><section><h2>大きく確認</h2><div class="stage large"><span class="label">原画の顔・毛並み・装具を使用</span><div class="floor"></div><canvas id="large" width="1000" height="952"></canvas></div><div class="controls"><button id="play" class="active">一時停止</button><button id="still">原画と比較</button><input id="time" aria-label="再生位置" type="range" min="0" max="6" step=".01" value="0"><span id="phase" class="phase"></span></div></section><section><h2>ゲーム画面相当の大きさ</h2><div class="stage smallstage"><span class="label">390px幅・前列相当</span><div class="floor"></div><canvas id="small" width="720" height="400"></canvas></div><p class="note">現行の戦場座標720pxに対して体幅240px。390px表示では約130pxです。拡大画と同じ動きを同時に再生します。</p><aside><h2>元の絵</h2><img class="original" src="original.png" alt="変更前のフェンリル原画"><p class="note">顔の描き直しや口の開閉は加えていません。これは1枚絵の2D変形による候補で、立体的な振り向きではありません。</p><p class="note">実ゲームへの採用前の確認用。ゲーム本体・保存データには変更を加えません。</p><p id="error" role="alert"></p></aside></section></div></main><script type="module">
import {createRenderer} from './rig.mjs';
const image=new Image();image.src='original.png';await image.decode();
const large=createRenderer(document.querySelector('#large'),image),small=createRenderer(document.querySelector('#small'),image);
const slider=document.querySelector('#time'),play=document.querySelector('#play'),still=document.querySelector('#still'),phase=document.querySelector('#phase');
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,compare=false,time=0,last=performance.now();
function draw(){const p=large.render(time,{reduced:compare,spriteWidth:900,bottom:923});small.render(time,{reduced:compare,spriteWidth:240,bottom:365});slider.value=time;phase.textContent=compare?'元の姿勢':p.phase;play.textContent=playing?'一時停止':'再生';play.classList.toggle('active',playing);still.classList.toggle('active',compare)}
play.onclick=()=>{playing=!playing;draw()};still.onclick=()=>{compare=!compare;draw()};slider.oninput=()=>{playing=false;time=+slider.value;draw()};
window.preview={setTime(t){time=t;playing=false;compare=false;draw()},setCompare(v){compare=v;draw()},get time(){return time}};
function frame(now){if(playing&&!document.hidden)time=(time+(now-last)/1000)%6;last=now;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);draw();window.ready=true;
</script></html>
