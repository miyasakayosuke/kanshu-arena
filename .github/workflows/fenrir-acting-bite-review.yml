name: Fenrir bite keypose review
on:
  push:
    branches: [candidate/fenrir-acting-bite-plan1]
permissions:
  contents: read
concurrency:
  group: fenrir-acting-bite-review
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'miyasakayosuke/kanshu-arena' && github.ref == 'refs/heads/candidate/fenrir-acting-bite-plan1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run rights:test && npm run rights:check && npm test && npm run build
      - run: node docs/fenrir-acting-bite/verify-study.mjs && node --test docs/fenrir-acting-bite/motion-checks.mjs docs/fenrir-acting-bite/high-leap-timing-checks.mjs
      - working-directory: qa/fenrir-acting-bite
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: qa/fenrir-acting-bite
        run: npx --no-install playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - working-directory: qa/fenrir-acting-bite
        run: node render.mjs && node leap-render.mjs && node stage-render.mjs && node descent-render.mjs && node contact-render.mjs && HANDOFF_PAIR=1 node contact-render.mjs && node full-render.mjs && node full-stage-render.mjs
      - name: Retain browser videos, keyposes and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fenrir-bite-review-${{ github.sha }}
          path: |
            qa/fenrir-acting-bite/evidence/*.png
            qa/fenrir-acting-bite/evidence/*.mp4
            qa/fenrir-acting-bite/evidence/*.json
          if-no-files-found: error
          retention-days: 7
